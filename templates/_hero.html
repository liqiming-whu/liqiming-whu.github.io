{% set h = site.pages[hero_key] %}
<section class="page-hero">
  <div class="page-hero-bg" style="background-image:url('{{ h.image }}')"></div>
  <div class="page-hero-overlay"></div>
  <div class="container page-hero-inner">
    <p class="eyebrow">{{ h.eyebrow }}</p>
    <h1>{{ h.title }}</h1>
    <p class="page-hero-desc">{{ fmt(h.desc, n=hero_n|default(''), start=stats.start) }}</p>
  </div>
</section>
