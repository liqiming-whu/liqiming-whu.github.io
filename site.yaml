# ---------- 首页 ----------
home:
  headline: 白天跟测序数据较劲，晚上给 AI 写插件。
  intro: 武汉大学生物信息学博士，即将毕业，正在找 AI 方向的工作。从生信脚本、终端配置一路折腾到 AI Agent 插件、长期记忆和 ComfyUI，这里收着做过的项目、踩过的坑，还有一些没什么用但挺好玩的东西。
  track_caption: 每个色块是一篇笔记，按写下的日期排在时间轴上，一行一个分类。点一下就能打开。
  recent_title: 最近的笔记
  projects_title: 最近在做
  about_title: 你好，我是 Venuslee
  about_text: 生物信息学博士，快毕业了。最早写这个博客时我还在读研，电脑里塞满了跑到一半的脚本和改了八遍的配置文件。后来兴趣一路拐进了 AI Agent，开始给各种宿主写插件和 Skills。这里两边的东西都记，如果某篇刚好帮你省下一个下午，那它就没白写。

author_bio_short: 一个不太聪明的年轻人，生信博士在读。
author_bio_post: 生信博士，快毕业了。爱折腾终端，现在也给 AI Agent 造轮子。
profile_role: Bioinformatics PhD candidate · WHU

