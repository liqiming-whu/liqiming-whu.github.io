skills:
  - name: 深度学习与大模型
    text: 用 PyTorch 开发和训练 CNN、ResNet、Transformer 等深度学习模型；熟悉大模型的使用，开发过多个 AI Agent 插件和 Skills（见[项目](/projects.html)）。
  - name: 自然语言处理
    text: 用 TensorFlow、scikit-learn 构建机器学习模型，对文献进行筛选和分类；熟悉分词、词向量、词频分析、文本特征提取等技术。
  - name: 编程与系统
    text: 用 Python 和 R 实现各种个性化分析需求；熟练使用和维护 Linux 系统。
  - name: 生信分析
    text: 分析 RNA-seq、ChIP-seq、CLIP-seq、CUT&Tag、GRO-seq、RIC-seq、CLASH 等测序数据，以及蛋白质组 IP/MS 数据，构建蛋白互作网络。独立开发并维护生信分析 Python 工具包 [pybiotk](https://pypi.org/project/pybiotk/)。
  - name: Web 开发
    text: 为武汉大学高等研究院开发文献数据库内部网站，用爬虫为数据库做文献调研；有多人协作开发项目的经验。

