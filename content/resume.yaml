summary: 生物信息学博士（武汉大学），即将毕业。熟悉深度学习、NLP 和大模型应用开发，开发和维护了 30 多个开源项目，大部分是 AI Agent 插件、长期记忆和 Skills；博士期间做多组学测序数据分析与生信数据库开发，研究涉及 RNA 加工、RNA 与组蛋白修饰和病毒感染，发表论文 6 篇。

